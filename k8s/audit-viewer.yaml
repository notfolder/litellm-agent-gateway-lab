# 利用料と入出力の履歴を検索するアプリ（変更設計書 6 章）。経路は /lab-audit/（LiteLLM 自身が /audit を持つため）。
# ./lab audit が変数を置き換えて使う。サインインの設定（OIDC）が無いときは入れない。
apiVersion: v1
kind: Service
metadata:
  name: audit-viewer
  namespace: litellm-lab
  annotations:
    # AWS（ALB）のヘルスチェックの経路。Mac（Traefik）では使われない
    alb.ingress.kubernetes.io/healthcheck-path: /lab-audit/healthz
spec:
  selector:
    app: audit-viewer
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-viewer
  namespace: litellm-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-viewer
  template:
    metadata:
      labels:
        app: audit-viewer
      annotations:
        lab/config-hash: "${CONFIG_HASH}"
    spec:
      # AWS では Pod Identity でこの ServiceAccount に IAM ロールが付く（S3 の静的キーは無い）
      serviceAccountName: audit-viewer
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: audit-viewer
      containers:
        - name: viewer
          image: ${IMAGE}
          command: ["python", "-m", "audit.viewer"]
          env:
            - name: AUDIT_S3_ENDPOINT
              value: "${S3_ENDPOINT}"
            - name: AUDIT_S3_REGION
              value: "${S3_REGION}"
            # boto3 1.36 以降の既定（送信時のチェックサム）を S3 互換のストレージが拒むことがある（GCS）。公式の回避策（害は無い）
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: when_required
            - name: AUDIT_S3_BUCKET_PREFIX
              value: "${S3_BUCKET_PREFIX}"
            - name: AUDIT_S3_BUCKET
              value: "${S3_BUCKET}"
            - name: AUDIT_ACCESS_RETENTION_DAYS
              value: "${ACCESS_RETENTION_DAYS}"
            - name: AUDIT_RETENTION_MODE
              value: "${RETENTION_MODE}"
            - name: AUDIT_BASE_URL
              value: "${BASE_URL}"
            - name: AUDIT_OIDC_ISSUER
              value: "${OIDC_ISSUER}"
            - name: AUDIT_ADMINS
              value: "${ADMINS}"
            - name: AUDIT_AUDITORS
              value: "${AUDITORS}"
            - name: AUDIT_ROLE_CLAIM
              value: "${ROLE_CLAIM}"
          envFrom:
            # S3 の静的キー（Mac の RustFS）。AWS では無いので optional
            - secretRef: { name: audit-viewer-s3, optional: true }
            - secretRef: { name: audit-viewer-oidc }
            - secretRef: { name: audit-viewer-session }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /lab-audit/healthz, port: 8000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: audit-viewer
  namespace: litellm-lab
spec:
  entryPoints:
    - web
  routes:
    # 優先度 50: 素通しの拒否（100）と MCP の GET（90）より後、その他すべて（1、LiteLLM）より先
    - kind: Rule
      priority: 50
      match: PathPrefix(`/lab-audit/`) || Path(`/lab-audit`)
      services:
        - name: audit-viewer
          port: 8000
