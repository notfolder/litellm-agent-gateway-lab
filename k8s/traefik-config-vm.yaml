# k3s 同梱の Traefik の設定（LAB_TARGET=aws-ec2。変更設計書 .history/2026-10-25-EC2三台構成/ 2 章、4.6 節）。
# Mac の traefik-config.yaml との違い:
# - replica 2。3 台とも server ノードなので「server ノードに置く」では 1 台に寄らず、入口の Pod が載った台が
#   止まっても Service の宛先が残るように 2 つにする
# - web（80）は websecure（443）へ転送する。経路（IngressRoute）は websecure 側に TLS 付きで置く（render.tls_ingressroutes）
# - 入口は内部ロードバランサ → 各台の 80/443 → Traefik の hostPort。ServiceLB（svclb）は使わない（Service は ClusterIP）。
#   svclb は送信元を自分の Pod の IP に書き換える（MASQUERADE。externalTrafficPolicy: Local でも）ので、Traefik に利用者の IP
#   （踏み台か VPC の中）が届かず、管理系の経路の IPAllowList が効かない（配備で判明 2026-10-31）。hostPort（CNI の portmap）は
#   DNAT だけで送信元を保つ。Traefik の Pod が無い台は内部ロードバランサのヘルスチェック（TCP 80）に落ち、転送先から外れる
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 2
    service:
      type: ClusterIP
    ports:
      web:
        hostPort: 80
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
        transport:
          respondingTimeouts:
            readTimeout: 600s
            writeTimeout: 600s
            idleTimeout: 600s
      websecure:
        hostPort: 443
        transport:
          respondingTimeouts:
            readTimeout: 600s
            writeTimeout: 600s
            idleTimeout: 600s
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
    # アクセスログ（入口で返した状態コードと、どの Pod に送ったかを残す。502 などの切り分けに使う）
    logs:
      access:
        enabled: true
        fields:
          headers:
            defaultmode: drop
