# k3s 同梱の Traefik の設定（LAB_TARGET=aws-ec2。変更設計書 .history/2026-10-25-EC2三台構成/ 2 章、4.6 節）。
# Mac の traefik-config.yaml との違い:
# - 全台に 1 つずつ（DaemonSet）。入口の印（litellm-lab/entry=true）のある台にだけ立つ。印は ./lab cluster が全台に付け、足す台を
#   減らすときに外す（変更設計書 .history/2026-10-31-台の増減とLiteLLMのメモリ/ 4 章）。前は replica 2 の Deployment だった
# - web（80）は websecure（443）へ転送する。経路（IngressRoute）は websecure 側に TLS 付きで置く（render.tls_ingressroutes）
# - 入口は内部ロードバランサ → 各台の 80/443 → Traefik の hostPort。ServiceLB（svclb）は使わない（Service は ClusterIP）。
#   svclb は送信元を自分の Pod の IP に書き換える（MASQUERADE。externalTrafficPolicy: Local でも）ので、Traefik に利用者の IP
#   （踏み台か VPC の中）が届かず、管理系の経路の IPAllowList が効かない（配備で判明 2026-10-31）。hostPort（CNI の portmap）は
#   DNAT だけで送信元を保つ。Traefik の Pod が無い台は内部ロードバランサのヘルスチェック（TCP 80）に落ち、転送先から外れる
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet
    nodeSelector:
      litellm-lab/entry: "true"
    service:
      # チャートの版で鍵が違う（k3s 1.35 の 39 は service.type、1.36 の 40 は service.spec.type）ので両方書く。
      # k3s の ServiceLB は注釈でも止める（LoadBalancer のままでも svclb を作らせない。版上げで判明 2026-10-31）
      type: ClusterIP
      spec:
        type: ClusterIP
      annotations:
        svccontroller.k3s.cattle.io/enablelb: "false"
    ports:
      web:
        hostPort: 80
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
        transport:
          respondingTimeouts:
            readTimeout: 600s
            writeTimeout: 600s
            idleTimeout: 600s
      websecure:
        hostPort: 443
        transport:
          respondingTimeouts:
            readTimeout: 600s
            writeTimeout: 600s
            idleTimeout: 600s
    # アクセスログ（入口で返した状態コードと、どの Pod に送ったかを残す。502 などの切り分けに使う）
    logs:
      access:
        enabled: true
        fields:
          headers:
            defaultmode: drop
