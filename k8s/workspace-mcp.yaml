# Gmail を読む MCP サーバー（taylorwilsdon/google_workspace_mcp）。クラスタ内だけに公開する。
# 外部トークンのモード: LiteLLM が付けて送るユーザーの Google アクセストークンを userinfo で確かめ、
# そのトークンで Gmail API を呼ぶ。サインイン画面やトークンの発行は行わない（docs/spec.md 5.3）
apiVersion: v1
kind: Service
metadata:
  name: workspace-mcp
  namespace: litellm-lab
spec:
  selector:
    app: workspace-mcp
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-mcp
  namespace: litellm-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace-mcp
  template:
    metadata:
      labels:
        app: workspace-mcp
    spec:
      # Service 名から作られる環境変数 WORKSPACE_MCP_PORT=tcp://… を、サーバーが自分の待ち受け
      # ポートとして読んでしまい起動に失敗する（2026-10-11 に確認）。Service の環境変数を入れない
      enableServiceLinks: false
      containers:
        - name: workspace-mcp
          image: ghcr.io/taylorwilsdon/google_workspace_mcp:2.1.0
          env:
            - name: MCP_ENABLE_OAUTH21
              value: "true"
            - name: EXTERNAL_OAUTH21_PROVIDER
              value: "true"
            - name: WORKSPACE_MCP_STATELESS_MODE
              value: "true"
            - name: WORKSPACE_MCP_TOOLS
              value: gmail
            - name: WORKSPACE_MCP_READ_ONLY
              value: "true"
            - name: WORKSPACE_EXTERNAL_URL
              value: http://workspace-mcp.litellm-lab.svc.cluster.local:8000
          envFrom:
            # GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET（secret が無いと起動しない）
            - secretRef:
                name: workspace-mcp
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
