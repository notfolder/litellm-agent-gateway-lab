# Traefik の入口（Mac の localhost:${LAB_HTTP_PORT} → LiteLLM）。
# プロバイダ API の素通し中継（パススルー）の経路は 403 にする（spec 4.2）。
# 一覧は LiteLLM v1.104.2 の proxy/pass_through_endpoints から抽出したもの。版を上げたら見直す。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-all
  namespace: litellm-lab
spec:
  ipAllowList:
    # どこからの接続も許さない（= 403）
    sourceRange:
      - 127.0.0.255/32
---
# MCP の経路（/<サーバー名>/mcp）への GET を 405 にするため、POST だけを受ける経路に置き換える。
# LiteLLM はセッション無しの GET に、終わらないイベントストリーム（200）を返す。Codex（0.162.1）は
# 起動時にこの GET を送って応答を待ち続け、MCP サーバーを使えなくなる（2026-10-11 に確認）。
# MCP の仕様では、サーバーはこの GET に 405 を返してよく、クライアントはそれを扱える
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mcp-get-not-allowed
  namespace: litellm-lab
spec:
  replacePath:
    path: /v1/chat/completions
---
# ノードが止まったとき、止まったノードの LiteLLM の Pod には、ノードが NotReady になって送り先から外れるまで
# （約 40 秒）要求が届き、接続の確立を既定の 30 秒待って失敗する（2026-10-12 の障害の試験で確認）。
# 接続を 2 秒で諦め、接続できなかった要求だけを別の Pod に送り直す（応答が始まった要求は送り直さない）
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: litellm-fast-dial
  namespace: litellm-lab
spec:
  forwardingTimeouts:
    dialTimeout: 2s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: litellm-retry
  namespace: litellm-lab
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm
  namespace: litellm-lab
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 100
      match: >-
        PathRegexp(`^/(anthropic|assemblyai|eu\.assemblyai|azure|azure_ai|bedrock|cohere|cursor|fal_ai|gemini|gigachat|langfuse|milvus|mistral|nvidia_nim|openai|openai_passthrough|openrouter|tinyfish|typesafe|vertex_ai|vertex-ai|vllm|watsonx)(/|$)`)
      middlewares:
        - name: deny-all
      services:
        - name: litellm
          port: 4000
    - kind: Rule
      priority: 90
      match: Method(`GET`) && PathRegexp(`^/[^/]+/mcp/?$`)
      middlewares:
        - name: mcp-get-not-allowed
      services:
        - name: litellm
          port: 4000
    - kind: Rule
      priority: 1
      match: PathPrefix(`/`)
      middlewares:
        - name: litellm-retry
      services:
        - name: litellm
          port: 4000
          serversTransport: litellm-fast-dial
