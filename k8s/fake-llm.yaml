# 審査ガードレールの試験用の偽 LLM（tests/fake-llm/server.py）。
# スクリプト本体は ConfigMap fake-llm-server（./lab mcp が作る）から読む
apiVersion: v1
kind: Service
metadata:
  name: fake-llm
  namespace: litellm-lab
spec:
  selector:
    app: fake-llm
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-llm
  namespace: litellm-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-llm
  template:
    metadata:
      labels:
        app: fake-llm
      annotations:
        lab/server-hash: "${FAKE_LLM_HASH}"
    spec:
      containers:
        - name: fake-llm
          image: python:3.13-alpine
          command: ["python", "-u", "/srv/server.py"]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: server
              mountPath: /srv
      volumes:
        - name: server
          configMap:
            name: fake-llm-server
