# LiteLLM 公式 Helm チャート（oci://ghcr.io/berriai/litellm-helm 1.104.2）の値。
# image.repository / image.tag / podAnnotations は ./lab litellm が上書き用の値（.build/litellm-overrides.json）で渡す。

replicaCount: 2
numWorkers: 1            # Kubernetes では 1 Pod 1 ワーカーが推奨

image:
  pullPolicy: IfNotPresent

# プロキシの設定は、スクリプトが生成した ConfigMap（litellm-config）を使う
proxyConfigMap:
  create: false
  name: litellm-config
  key: config.yaml

masterkeySecretName: litellm-secrets
masterkeySecretKey: LITELLM_MASTER_KEY

environmentSecrets:
  - litellm-secrets

envVars:
  LITELLM_MODE: PRODUCTION
  # DISABLE_SCHEMA_UPDATE はチャートが設定する（migrationJob を有効にすると本体の Pod は true、Job は false）
  PROXY_BASE_URL: http://localhost:8080
  CHATGPT_TOKEN_DIR: /var/lib/lab/chatgpt
  UI_USERNAME: admin                   # SSO が無いときの管理画面のログイン（パスワードはマスターキー）

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4                       # OrbStack のメモリ上限 8 GB に収める
  targetCPUUtilizationPercentage: 60

# 起動に時間がかかる（DB 接続と Prisma）ので、startupProbe は既定（最大 300 秒）のまま

# Pod を止めるとき、止める前に 10 秒待つ。止めると決まってから入口（Traefik）が送り先から外すまでに
# 数秒かかり、その間に届いた要求が 502 になる（2026-10-11 に確認。Codex は起動時の確認がこれに当たると、
# その回は MCP のツールを使えないまま動く）。待っている間も要求は普通に処理し、その後の SIGTERM で
# 処理中の要求を終えてから止まる（terminationGracePeriodSeconds は既定の 90 秒）
lifecycle:
  preStop:
    exec:
      command: ["sleep", "10"]

# chatgpt/ のトークンを全 Pod で共有する（k3d が全ノードに同じホストのフォルダを見せている）
volumes:
  - name: chatgpt-token
    hostPath:
      path: /var/lib/lab/chatgpt
      type: DirectoryOrCreate
volumeMounts:
  - name: chatgpt-token
    mountPath: /var/lib/lab/chatgpt

db:
  useExisting: true
  deployStandalone: false
  endpoint: postgres
  database: litellm
  secret:
    name: postgres
    usernameKey: username
    passwordKey: password

redis:
  enabled: false

migrationJob:
  enabled: true
  hooks:
    argocd:
      enabled: false
    helm:
      enabled: true                    # 素の helm で、install / upgrade の前に DB 移行を流す

ingress:
  enabled: false                       # k8s/ingress.yaml（Traefik）を使う
